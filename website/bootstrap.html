<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bakeyy E-Commerce</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: #fff8f3;
}

.hero {
  height: 80vh;
  background: url('https://images.unsplash.com/photo-1509440159596-0249088772ff') center/cover;
  position: relative;
  color: white;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
}

.hero-content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card img {
  height: 200px;
  object-fit: cover;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
<div class="container">
  <a class="navbar-brand fw-bold">Bakeyy</a>

  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="nav">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
    </ul>

    <button class="btn btn-warning ms-lg-3" data-bs-toggle="offcanvas" data-bs-target="#cart">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>
</div>
</nav>

<!-- HERO -->
<header class="hero">
  <div class="hero-content">
    <h1 class="display-4 fw-bold">Fresh Bakery Products</h1>
    <p>Best Cakes, Boxes & Bakeware Items</p>
    <a href="#products" class="btn btn-warning btn-lg">Shop Now</a>
  </div>
</header>

<!-- PRODUCTS -->
<section id="products" class="py-5">
<div class="container">
  <h2 class="text-center mb-4">Our Products</h2>

  <div class="row g-4">

    <!-- Product -->
    <div class="col-md-4">
      <div class="card shadow">
        <img src="https://images.unsplash.com/photo-1542826438-bd32f43d626f">
        <div class="card-body text-center">
          <h5>Cake Box</h5>
          <p>₹299</p>
          <button class="btn btn-dark w-100" onclick="addToCart('Cake Box',299)">
            Add to Cart
          </button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow">
        <img src="https://images.unsplash.com/photo-1519869325930-281384150729">
        <div class="card-body text-center">
          <h5>Cupcake Box</h5>
          <p>₹399</p>
          <button class="btn btn-dark w-100" onclick="addToCart('Cupcake Box',399)">
            Add to Cart
          </button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow">
        <img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a">
        <div class="card-body text-center">
          <h5>Donut Box</h5>
          <p>₹199</p>
          <button class="btn btn-dark w-100" onclick="addToCart('Donut Box',199)">
            Add to Cart
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
</section>

<!-- CART (OFFCANVAS) -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="cart">
<div class="offcanvas-header">
  <h5>Your Cart</h5>
  <button class="btn-close" data-bs-dismiss="offcanvas"></button>
</div>

<div class="offcanvas-body">
  <div id="cartItems"></div>

  <hr>
  <h5>Total: ₹<span id="total">0</span></h5>

  <button class="btn btn-success w-100 mt-3" onclick="placeOrder()">
    Place Order
  </button>
</div>
</div>

<!-- SCRIPT -->
<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function addToCart(name, price){
  let item = cart.find(i => i.name === name);

  if(item){
    item.qty += 1;
  } else {
    cart.push({name, price, qty:1});
  }

  saveCart();
}

function renderCart(){
  let cartItems = document.getElementById("cartItems");
  let total = 0;

  cartItems.innerHTML = "";

  cart.forEach((item, index) => {
    total += item.price * item.qty;

    cartItems.innerHTML += `
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
          <b>${item.name}</b><br>
          ₹${item.price} x ${item.qty}
        </div>
        <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">x</button>
      </div>
    `;
  });

  document.getElementById("total").innerText = total;
  document.getElementById("cartCount").innerText = cart.length;
}

function removeItem(index){
  cart.splice(index,1);
  saveCart();
}

function placeOrder(){
  if(cart.length === 0){
    alert("Cart is empty!");
    return;
  }

  alert("Order placed successfully 🎉");
  cart = [];
  saveCart();
}

renderCart();
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
