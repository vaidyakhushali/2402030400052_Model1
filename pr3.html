<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 30px;
            width: 450px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"] {
            padding: 10px;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .linkedin-link {
            display: block;
            margin-top: -10px;
            margin-bottom: 15px;
            color: blue;
            text-decoration: none;
        }

        .linkedin-link:hover {
            text-decoration: underline;
        }

        img {
            display: block;
            margin: 15px auto;
            border-radius: 10px;
        }

        marquee {
            color: red;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <marquee behavior="scroll" direction="left">
            Welcome to Registration Form
        </marquee>

        <h2>Registration Form</h2>
        <iframe src="https://www.wikipedia.org/" width="100%" height="200"
            style="border:2px solid #ccc; border-radius:10px;">
        </iframe>

        <form>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <a class="linkedin-link" href="https://www.linkedin.com/feed/">
                Visit LinkedIn
            </a>

            <label for="contact">Contact No:</label>
            <input type="tel" id="contact" name="contact" required>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" required></textarea>

            <label for="state">State:</label>
            <select id="state" name="state" required>
                <option value="">Select State</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Rajasthan">Rajasthan</option>
            </select>

            <label>Gender:</label><br>

            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>

            <br><br>

            <label>Hobbies:</label><br>

            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label><br>

            <input type="checkbox" id="swimming" name="hobbies" value="swimming">
            <label for="swimming">Swimming</label><br>

            <input type="checkbox" id="dancing" name="hobbies" value="dancing">
            <label for="dancing">Dancing</label><br><br>

            <label>Audio:</label><br>
            <audio controls> >
                <source src="c:\Users\Khushi Vaidya\Downloads\sample-3s.mp3" type="audio/mpeg">
            </audio>

            <br><br>
            <label>Video:</label><br>
            <video width="100%" controls>
                <source src="c:\Users\Khushi Vaidya\Downloads\sample-1.mp4" type="video/mp4">
            </video>
            <br><br>
            <input type="submit" value="Submit">

        </form>
    </div>

</body>

</html>
