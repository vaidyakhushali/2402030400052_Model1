<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realistic Birthday Animation</title>

<style>

    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
        background:linear-gradient(to bottom,#0f172a,#1e293b);
        font-family:Arial, sans-serif;
    }

    .scene{
        position:relative;
        width:900px;
        height:550px;
    }

    h1{
        position:absolute;
        top:20px;
        width:100%;
        text-align:center;
        font-size:60px;
        color:#fff;
        letter-spacing:3px;
        animation:glow 2s infinite alternate;
    }

    @keyframes glow{
        from{
            text-shadow:0 0 10px #ff8fab,
                        0 0 20px #ff8fab;
        }

        to{
            text-shadow:0 0 20px #ffd6e0,
                        0 0 40px #ff4d6d;
        }
    }
    .floor{
        position:absolute;
        bottom:0;
        width:100%;
        background:linear-gradient(to top,#3d2c1e,#5a3d2b);
    }
    .table{
        position:absolute;
        bottom:120px;
        left:300px;
        width:300px;
        height:22px;
        background:linear-gradient(to right,#6f4e37,#8b5e3c);
        border-radius:15px;
        box-shadow:0 10px 20px rgba(0,0,0,0.4);
    }
    .table::before,
    .table::after{
        content:"";
        position:absolute;
        width:18px;
        height:120px;
        background:#6f4e37;
        top:18px;
        border-radius:10px;
    }
    .table::before{
        left:30px;
    }

    .table::after{
        right:30px;
    }

    .cake{
        position:absolute;
        left:355px;
        bottom:142px;
    }
    .layer1{
        width:190px;
        height:85px;
        background:linear-gradient(to bottom,#ff85a2,#ff4d6d);
        border-radius:15px;
        position:relative;
        box-shadow:0 8px 15px rgba(0,0,0,0.3);
    }
    .layer2{
        width:130px;
        height:60px;
        background:linear-gradient(to bottom,#ffc2d1,#ff8fab);
        border-radius:15px;
        position:absolute;
        left:30px;
        top:-55px;
        box-shadow:0 5px 12px rgba(0,0,0,0.2);
    }

    /* Cream Drips */
    .cream{
        width:100%;
        height:18px;
        background:white;
        border-radius:20px;
        position:absolute;
        top:0;
    }

    .cream::before,
    .cream::after{
        content:"";
        position:absolute;
        width:18px;
        height:30px;
        background:white;
        border-radius:0 0 10px 10px;
    }

    .cream::before{
        left:40px;
    }

    .cream::after{
        right:40px;
    }

    /* Candle */
    .candle{
        width:14px;
        height:50px;
        background:repeating-linear-gradient(
            45deg,
            #4dabf7,
            #4dabf7 5px,
            white 5px,
            white 10px
        );

        position:absolute;
        left:88px;
        top:-95px;
        border-radius:5px;
    }

    /* Flame */
    .flame{
        width:22px;
        height:32px;
        background:radial-gradient(circle,yellow,orange);
        border-radius:50% 50% 50% 50%;
        position:absolute;
        top:-28px;
        left:-4px;

        animation:flicker 0.4s infinite alternate;
        filter:drop-shadow(0 0 12px gold);
    }

    @keyframes flicker{
        from{
            transform:scale(1) rotate(-2deg);
        }

        to{
            transform:scale(1.1) rotate(2deg);
        }
    }

    /* Balloons */
    .balloon{
        width:70px;
        height:90px;
        border-radius:50%;
        position:absolute;

        animation:fly 9s linear infinite;
        box-shadow:inset -10px -10px 20px rgba(0,0,0,0.2);
    }

    .balloon::before{
        content:"";
        position:absolute;
        width:20px;
        height:20px;
        background:inherit;
        bottom:-8px;
        left:25px;
        transform:rotate(45deg);
    }

    .balloon::after{
        content:"";
        width:2px;
        height:120px;
        background:#ccc;
        position:absolute;
        top:88px;
        left:34px;
    }

    .b1{
        background:#ff4d6d;
        left:120px;
        bottom:-150px;
        animation-delay:0s;
    }

    .b2{
        background:#4dabf7;
        left:280px;
        bottom:-180px;
        animation-delay:2s;
    }

    .b3{
        background:#ffd43b;
        left:520px;
        bottom:-140px;
        animation-delay:1s;
    }

    .b4{
        background:#9b5de5;
        left:720px;
        bottom:-200px;
        animation-delay:3s;
    }

    @keyframes fly{
        0%{
            transform:translateY(0) rotate(0deg);
        }

        100%{
            transform:translateY(-850px) rotate(10deg);
        }
    }

    /* Sparkles */
    .sparkle{
        position:absolute;
        width:5px;
        height:5px;
        background:white;
        border-radius:50%;

        animation:twinkle 2s infinite;
    }

    @keyframes twinkle{
        0%,100%{
            opacity:0.2;
            transform:scale(1);
        }

        50%{
            opacity:1;
            transform:scale(1.8);
        }
    }

</style>
</head>

<body>

<div class="scene">

    <h1>Happy Birthday </h1>

    <!-- Sparkles -->
    <div class="sparkle" style="top:80px; left:120px;"></div>
    <div class="sparkle" style="top:140px; left:250px;"></div>
    <div class="sparkle" style="top:90px; left:700px;"></div>
    <div class="sparkle" style="top:180px; left:600px;"></div>

    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>

    <!-- Table -->
    <div class="table"></div>

    <!-- Cake -->
    <div class="cake">

        <div class="layer1">
            <div class="cream"></div>
        </div>

        <div class="layer2">
            <div class="cream"></div>
        </div>

        <div class="candle">
            <div class="flame"></div>
        </div>

    </div>
    <div class="floor"></div>
</div>
</body>
</html>
